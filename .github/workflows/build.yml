name: Build Xelemetry

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build_xelemetry:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout code
        uses: actions/checkout@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.actor }}/xelemetry:latest
      # - 
      #   name: Deploy via Portainer webhook
      #   run: curl -X POST "${{ secrets.PORTAINER_WEBHOOK_PORTFOLIO }}"
